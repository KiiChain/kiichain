name: Spellcheck
on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.go'
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install cspell
        run: npm install -g cspell
      - name: Run cspell
        run: cspell --config .cspell.json "**/*.md" "**/*.go"
