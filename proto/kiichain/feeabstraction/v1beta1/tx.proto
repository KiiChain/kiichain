syntax = "proto3";
package kiichain.feeabstraction.v1beta1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "kiichain/feeabstraction/v1beta1/params.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/kiichain/kiichain/x/feeabstraction/types";

// Msg defines the fee abstraction module gRPC message service
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a governance operation for updating the
  // x/feeabstraction params
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateFeeTokens defines a governance operation for updating the fee tokens
  rpc UpdateFeeTokens(MsgUpdateFeeTokens) returns (MsgUpdateFeeTokensResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "feeabstraction/update-params";

  // authority is the address of the governance account.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the x/feeabstraction parameters to update.
  Params params = 2 [ (gogoproto.nullable) = false ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgUpdateFeeTokens is the Msg/UpdateFeeTokens request type.
message MsgUpdateFeeTokens {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "feeabstraction/update-fee-tokens";

  // authority is the address of the governance account.
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // tokens defines the fee tokens to update.
  UpdateTokenMetadataCollection tokens = 2 [ (gogoproto.nullable) = false ];
}

// UpdateTokenMetadata defines the metadata for a fee token to be updated
message UpdateTokenMetadata {
  // Denom is the token denom
  string denom = 1;
  // Identifier on the oracle module
  string oracle_denom = 2;
  // Decimals is the number of decimals for the token
  uint32 decimals = 3;
  // Enabled indicates if the token is enabled for fee abstraction
  bool enabled = 4;
}

// Defines a collection of fee token metadata to be updated
message UpdateTokenMetadataCollection {
  // Items is a repeated field of UpdateTokenMetadata
  repeated UpdateTokenMetadata items = 1 [ (gogoproto.nullable) = false ];
}


// MsgUpdateFeeTokensResponse defines the response structure for update fee
// tokens
message MsgUpdateFeeTokensResponse {}
