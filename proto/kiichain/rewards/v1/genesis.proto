syntax = "proto3";
package kiichain.rewards.v1;

import "gogoproto/gogo.proto";
import "kiichain/rewards/v1/params.proto";
import "kiichain/rewards/v1/types.proto";

option go_package = "github.com/kiichain/kiichain/x/rewards/types";

// GenesisState defines the rewards module's genesis state.
message GenesisState {
  // params defines the parameters of the module.
  Params params = 1 [ (gogoproto.nullable) = false ];

  // Reserved: previously release_schedule
  reserved 2;
  reserved "release_schedule";

  // reward_pool tracks cumulative emissions. Spendable funds are the module account.
  RewardPool reward_pool = 3 [ (gogoproto.nullable) = false ];
}
