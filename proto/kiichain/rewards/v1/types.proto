syntax = "proto3";
package kiichain.rewards.v1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/kiichain/kiichain/x/rewards/types";

// RewardPool tracks cumulative emissions. Spendable funds are the rewards
// module account balance in x/bank, not a balance stored here.
message RewardPool {
  // Reserved: formerly community_pool. Balances live in the module account.
  reserved 1;
  reserved "community_pool";

  // Reserved: formerly last_release_time (wall-clock Δt emissions).
  reserved 2;
  reserved "last_release_time";

  // Cumulative amount released from the pool (observability only)
  cosmos.base.v1beta1.Coin total_released = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"total_released\""
  ];
}
