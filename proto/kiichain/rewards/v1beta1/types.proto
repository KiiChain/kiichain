syntax = "proto3";
package kiichain.rewards.v1beta1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/timestamp.proto";
import "amino/amino.proto";

option go_package = "github.com/kiichain/kiichain/x/rewards/types";

// RewardPool is the global fee pool for distribution.
message RewardPool {
  repeated cosmos.base.v1beta1.DecCoin community_pool = 1 [
    (gogoproto.nullable)     = false,
    (amino.dont_omitempty)   = true,
    (gogoproto.castrepeated) = "github.com/cosmos/cosmos-sdk/types.DecCoins"
  ];

  // Timestamp of the last emission release
  google.protobuf.Timestamp last_release_time = 2 [
    (gogoproto.stdtime) = true,
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"last_release_time\""
  ];

  // Cumulative amount released from the pool (observability only)
  cosmos.base.v1beta1.Coin total_released = 3 [
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"total_released\""
  ];
}
